    <polygon points="81.0,304.1 75.3,377.9 151.5,326.5" />
  </g>
  <!-- The phone in the middle -->
  <rect x="186" y="136" width="140" height="240" rx="30" fill="#ffffff" />
  <rect x="200" y="156" width="112" height="190" rx="14" fill="#0B2447" />
  <circle cx="256" cy="251" r="22" fill="#3DDC84" />
  <rect x="236" y="358" width="40" height="8" rx="4" fill="#0B2447" />
